<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salah Dashboard</title>

<style>
body{
  margin:0;
  padding:20px;
  max-width:700px;
  margin:auto;
  font-family:system-ui,sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

.time{font-size:3rem;font-weight:700;}
.day{color:#64748b;margin-bottom:5px;}

.card{
  background:#fff;
  border-radius:18px;
  padding:14px;
  margin:10px 0;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
}

.active{border:2px solid #2563eb;}

.name{font-weight:700;letter-spacing:.08em;}
.range{color:#64748b;margin-top:4px;}

.hero{margin-top:10px;font-weight:600;}

.bar{
  height:8px;
  background:#e5e7eb;
  border-radius:99px;
  position:relative;
  margin-top:10px;
}

.fill{height:100%;background:#2563eb;border-radius:99px;}

.dot{
  width:14px;height:14px;
  background:#2563eb;
  border-radius:50%;
  position:absolute;
  top:50%;
  transform:translate(-50%,-50%);
}
</style>
</head>

<body>

<div id="clock" class="time"></div>
<div id="day" class="day"></div>
<div id="date" class="day"></div>

<div id="prayers"></div>
<div id="restricted"></div>

<script>
const LAT=23.8103;
const LNG=90.4125;

function t12(d){
  return new Intl.DateTimeFormat('en-US',{
    hour:'numeric',minute:'2-digit',hour12:true
  }).format(d);
}

function clock(){
  const n=new Date();
  document.getElementById('clock').textContent=t12(n);
  document.getElementById('day').textContent=
    new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(n);
  document.getElementById('date').textContent=
    new Intl.DateTimeFormat('en-US',{year:'numeric',month:'long',day:'numeric'}).format(n);
}

async function getTimes(){
  const r=await fetch(
    `https://api.aladhan.com/v1/timings?latitude=${LAT}&longitude=${LNG}&method=2`
  );
  const j=await r.json();
  return j.data.timings;
}

// build absolute datetime
function dt(str, dayOffset=0){
  const [h,m]=str.split(':').map(Number);
  const d=new Date();
  d.setDate(d.getDate()+dayOffset);
  d.setHours(h,m,0,0);
  return d;
}

function render(t){

  const now=new Date();

  // 🔥 BUILD FULL CONTINUOUS CHAIN (today + tomorrow Fajr)
  const windows=[
    {name:'Fajr',start:dt(t.Fajr,0),end:dt(t.Sunrise,0)},
    {name:'Dhuhr',start:dt(t.Dhuhr,0),end:dt(t.Asr,0)},
    {name:'Asr',start:dt(t.Asr,0),end:dt(t.Maghrib,0)},
    {name:'Maghrib',start:dt(t.Maghrib,0),end:dt(t.Isha,0)},
    {name:'Isha',start:dt(t.Isha,0),end:dt(t.Fajr,1)}
  ];

  let active = windows.find(w => now >= w.start && now < w.end) || null;
  let next = active ? null : windows.find(w => w.start > now) || windows[0];

  const root=document.getElementById('prayers');
  root.innerHTML='';

  windows.forEach(w=>{

    const isActive=active && active.name===w.name;
    const isNext=!active && next && next.name===w.name;

    let extra='';

    if(isActive){
      const p=(now-w.start)/(w.end-w.start);
      const rem=Math.floor((w.end-now)/60000);

      extra=`
        <div class="hero">${Math.floor(rem/60)}h ${rem%60}m remaining</div>
        <div class="bar">
          <div class="fill" style="width:${p*100}%"></div>
          <div class="dot" style="left:${p*100}%"></div>
        </div>
      `;
    }

    else if(isNext){
      const rem=Math.floor((w.start-now)/60000);
      extra=`<div class="hero">${Math.floor(rem/60)}h ${rem%60}m until start</div>`;
    }

    root.innerHTML+=`
      <div class="card ${isActive?'active':''}">
        <div class="name">${w.name}</div>
        <div class="range">${t12(w.start)} → ${t12(w.end)}</div>
        ${extra}
      </div>
    `;
  });

  // restricted times (safe, independent)
  const sunrise=dt(t.Sunrise,0);
  const dhuhr=dt(t.Dhuhr,0);
  const maghrib=dt(t.Maghrib,0);

  document.getElementById('restricted').innerHTML=`
    <div class="card">
      Sunrise<br>${t12(sunrise)} → ${t12(new Date(sunrise.getTime()+15*60000))}
    </div>
    <div class="card">
      Zenith<br>${t12(new Date(dhuhr.getTime()-3*60000))} → ${t12(dhuhr)}
    </div>
    <div class="card">
      Sunset<br>${t12(new Date(maghrib.getTime()-15*60000))} → ${t12(maghrib)}
    </div>
  `;
}

(async()=>{
  clock();
  setInterval(clock,1000);

  const t=await getTimes();
  render(t);
  setInterval(()=>render(t),60000);
})();
</script>

</body>
</html>
