<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salah Dashboard</title>

<style>
body{
  margin:0;
  padding:20px;
  max-width:700px;
  margin:auto;
  font-family:system-ui,sans-serif;
  background:#f8fafc;
  color:#0f172a;
}

.time{font-size:3rem;font-weight:700;}
.day{color:#64748b;margin-bottom:5px;}

.card{
  background:#fff;
  border-radius:18px;
  padding:14px;
  margin:10px 0;
  box-shadow:0 6px 20px rgba(0,0,0,.06);
}

.active{border:2px solid #2563eb;}

.name{font-weight:700;letter-spacing:.08em;}
.range{color:#64748b;margin-top:4px;}

.hero{margin-top:10px;font-weight:600;}

.bar{
  height:8px;
  background:#e5e7eb;
  border-radius:99px;
  position:relative;
  margin-top:10px;
}

.fill{height:100%;background:#2563eb;border-radius:99px;}
.dot{
  width:14px;height:14px;background:#2563eb;border-radius:50%;
  position:absolute;top:50%;transform:translate(-50%,-50%);
}
</style>
</head>

<body>

<div id="clock" class="time"></div>
<div id="day" class="day"></div>
<div id="date" class="day"></div>

<div id="prayers"></div>

<script>
const LAT=23.8103, LNG=90.4125;

function t12(d){
  return new Intl.DateTimeFormat('en-US',{
    hour:'numeric',minute:'2-digit',hour12:true
  }).format(d);
}

function clock(){
  const n=new Date();
  document.getElementById('clock').textContent=t12(n);
  document.getElementById('day').textContent=
    new Intl.DateTimeFormat('en-US',{weekday:'long'}).format(n);
  document.getElementById('date').textContent=
    new Intl.DateTimeFormat('en-US',{year:'numeric',month:'long',day:'numeric'}).format(n);
}

function mins(d){ return d.getTime()/60000; }

async function getTimes(){
  const r=await fetch(
    `https://api.aladhan.com/v1/timings?latitude=${LAT}&longitude=${LNG}&method=2`
  );
  const j=await r.json();
  return j.data.timings;
}

function buildCycle(t){

  const now = new Date();

  const Fajr = new Date();
  const [fh,fm]=t.Fajr.split(':').map(Number);
  Fajr.setHours(fh,fm,0,0);

  const Sunrise = new Date();
  const [sh,sm]=t.Sunrise.split(':').map(Number);
  Sunrise.setHours(sh,sm,0,0);

  const Dhuhr = new Date();
  const [dh,dm]=t.Dhuhr.split(':').map(Number);
  Dhuhr.setHours(dh,dm,0,0);

  const Asr = new Date();
  const [ah,am]=t.Asr.split(':').map(Number);
  Asr.setHours(ah,am,0,0);

  const Maghrib = new Date();
  const [mh,mm]=t.Maghrib.split(':').map(Number);
  Maghrib.setHours(mh,mm,0,0);

  const Isha = new Date();
  const [ih,im]=t.Isha.split(':').map(Number);
  Isha.setHours(ih,im,0,0);

  // 🔥 KEY IDEA: if we're after midnight but before Fajr,
  // treat Fajr as tomorrow anchor
  let cycleOffset = 0;
  if(now < Fajr){
    cycleOffset = -1;
  }

  const addDay = (d, offset)=>{
    const x=new Date(d);
    x.setDate(x.getDate()+offset);
    return x;
  };

  const windows = [
    {name:"Fajr",start:addDay(Fajr,cycleOffset),end:addDay(Sunrise,cycleOffset)},
    {name:"Dhuhr",start:addDay(Dhuhr,cycleOffset),end:addDay(Asr,cycleOffset)},
    {name:"Asr",start:addDay(Asr,cycleOffset),end:addDay(Maghrib,cycleOffset)},
    {name:"Maghrib",start:addDay(Maghrib,cycleOffset),end:addDay(Isha,cycleOffset)},
    {name:"Isha",start:addDay(Isha,cycleOffset),end:addDay(Fajr,cycleOffset+1)}
  ];

  return windows;
}

function render(windows){

  const now=new Date();

  let active=null,next=null;

  for(const w of windows){
    if(now>=w.start && now<w.end){
      active=w;
      break;
    }
  }

  if(!active){
    next=windows.find(w=>w.start>now)||windows[0];
  }

  const root=document.getElementById('prayers');
  root.innerHTML="";

  windows.forEach(w=>{

    const highlight=(active&&active.name===w.name)||
                     (!active&&next&&next.name===w.name);

    let extra="";

    if(active&&active.name===w.name){

      const p=(now-w.start)/(w.end-w.start);
      const rem=Math.floor((w.end-now)/60000);

      extra=`
        <div class="hero">${Math.floor(rem/60)}h ${rem%60}m remaining</div>
        <div class="bar">
          <div class="fill" style="width:${p*100}%"></div>
          <div class="dot" style="left:${p*100}%"></div>
        </div>
      `;
    }

    if(!active&&next&&next.name===w.name){
      const rem=Math.floor((w.start-now)/60000);
      extra=`<div class="hero">${Math.floor(rem/60)}h ${rem%60}m until start</div>`;
    }

    root.innerHTML+=`
      <div class="card ${highlight?'active':''}">
        <div class="name">${w.name}</div>
        <div class="range">${t12(w.start)} → ${t12(w.end)}</div>
        ${extra}
      </div>
    `;
  });
}

(async()=>{
  clock();
  setInterval(clock,1000);

  const t=await getTimes();
  const windows=buildCycle(t);

  render(windows);
  setInterval(()=>render(windows),60000);
})();
</script>

</body>
</html>
